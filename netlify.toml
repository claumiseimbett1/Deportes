# Sitio estático: publica la raíz del repo (index.html, gracias.html, assets).
# En Netlify → Site settings → Environment variables: GOOGLE_API_KEY
[build]
  publish = "."
  command = "node scripts/generate-config.js"

# Los formularios se registran al desplegar si el <form> incluye netlify / data-netlify="true".
# Activar correo en Netlify: Forms → contacto-festi-torneo-sinu → Notifications → aquatencd@gmail.com

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/gracias.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
